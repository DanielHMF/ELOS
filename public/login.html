        </a>
        
        <div class="header_botoes">

    <main class="acesso">
        <div class="acesso_texto">
            <h1>Que bom te ver de novo.</h1>
            <p>Suas pessoas estão te esperando. Entre para ver como está o seu mapa hoje.</p>
            <img class="acesso_imagem" src="imgs/mapa_login.svg" alt="Mapa com a palavra Você no centro e pessoas ao redor">

        <div class="acesso_lado_formulario">
            <div class="formulario">
                <h2>Entrar</h2>
                <p class="formulario_subtitulo">Use o e-mail do seu cadastro.</p>

                <div class="campo">
                    <label for="email_input">E-mail</label>
                    <input id="email_input" type="text" placeholder="voce@email.com">
                </div>

                <div class="campo">
                    <label for="senha_input">Senha</label>
                    <input id="senha_input" type="password" placeholder="••••••••">
                </div>

                <span class="mensagem_erro" id="login_erro"></span>

                <button class="botao_primario botao_largo" onclick="entrar()">Entrar</button>

                <div class="divisor">
                    <span></span>
                    <p>ou</p>
                    <span></span>
                </div>

                <a class="botao_secundario botao_largo" href="cadastro.html">Criar uma conta</a>
            </div>
        </div>
    </main>

    <footer class="rodape">
        <a class="logo logo_negativo" href="index.html">
            <img src="imgs/logo_negativo.svg" alt="Símbolo do ELOS">
            <span>ELOS</span>
        </a>
        <p>Projeto individual · SPTech · 2026/2 · Daniel Henrique Matos Ferreira</p>
    </footer>
</body>
</html>

<script>
    // Chamada pelo botão "Entrar" (onclick no HTML)
    function entrar() {
        let email = email_input.value.toLowerCase().trim()
        let senha = senha_input.value.trim()

        login_erro.innerHTML = ''

        if (email == '' || senha == '') {
            login_erro.innerHTML = 'Preencha todos os campos!'
        } else {
            // POST /usuarios/autenticar → usuarioController.autenticar
            fetch('/usuarios/autenticar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    emailServer: email,
                    senhaServer: senha
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (usuario) {
                        // guarda o usuário para as telas logadas usarem
                        sessionStorage.ID_USUARIO = usuario.id
                        sessionStorage.NOME_USUARIO = usuario.nome
                        sessionStorage.EMAIL_USUARIO = usuario.email
                        window.location.href = 'dash.html'
                    })
                } else {
                    // 403 = e-mail e/ou senha inválidos
                    resposta.text().then(function (mensagem) {
                        login_erro.innerHTML = mensagem
                    })
                }
            }).catch(function (erro) {
                console.log(erro)
                login_erro.innerHTML = 'Não foi possível conectar ao servidor'
            })
        }
    }
</script>
